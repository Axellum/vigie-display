# ============================================================================
# [AI-CONTEXT]
# @file carte-waveshare-7b.yaml
# @role Socle matériel autonome de la carte Waveshare ESP32-P4-WIFI6-Touch-LCD-7B :
#       7" IPS 1024×600 (EK79007 MIPI-DSI, reset GPIO33), P4 v3.2 @ 400 MHz
#       (`engineering_sample: false`), 32 Mo de flash QSPI, 32 Mo PSRAM hex 200 MHz,
#       tactile GT911 (reset GPIO23), audio ES8311 (`volume_max: 75%` = 0 dB) +
#       ampli NS4150B (GPIO53), double micro ES7210, Wi-Fi 6 SDIO ESP32-C6 (reset
#       CORE via `tab5_lien_c6.cpp`).
# @architecture_constraint 100 % autonome (ZÉRO dépendance Home Assistant, ZÉRO
#       bouchon domotique hérité du Tab5). Partage les mêmes identifiants matériels
#       (`tab5_display`, `touch`, `bsp_bus`, `backlight`, `mic_bus`, `tab5_speaker`,
#       `speaker_player`, `speaker_enable`) que `carte-tab5.yaml` pour l'architecture
#       Multi-Écrans (`vigie_carte: waveshare-7b` ou `tab5`).
# @hardware Référence complète : `docs/audits/BASE_CONNAISSANCE_WAVESHARE_7B.md`.
#       Batterie Li-ion 1S sur connecteur J4 (MX1.25, chargeur ETA6098, boost 5 V
#       SCT12A0) : tension mesurable sur `GPIO20` (pont 200 kΩ / 100 kΩ → VBAT / 3,
#       `multiply: 3.0`). Support pile RTC BAT1 : ML1220 rechargeable uniquement
#       (jamais CR1220).
# ============================================================================
packages:
  geometrie: !include geometrie-waveshare-7b.yaml
  imu: !include tab5-imu-absente.yaml

substitutions:
  # Extinction complète de la dalle EK79007 (voile noir + DCS 0x28 Display Off + 0x10 Sleep In)
  # et extinction pendant les mises à jour OTA (évite le scintillement HSYNC/VSYNC).
  carte_dalle_extinction: "2"
  carte_dalle_noire_ota: "1"
  # Le firmware d'usine de l'ESP32-C6 de la 7B ne répond pas à la requête de version ESP-Hosted
  # (bloquerait la boucle 1 s par essai) : désactivé tant que le C6 n'est pas reflashé en 2.12.12.
  carte_c6_version: "false"
  # Reset de l'EK79007 câblé en direct sur GPIO33 du P4 (pas d'expandeur I2C à attendre) : 0 ms.
  carte_attente_ecran_ms: "0"
  # Broches GPS UART par défaut sur le connecteur P3 de la Waveshare 7B (Option A)
  vigie_gps_rx_pin: "GPIO4"
  vigie_gps_tx_pin: "GPIO5"
  vigie_gps_baud_rate: "9600"

esphome:
  includes:
    - firmware/ecran/carte_7b_version.h
    - firmware/ecran/tab5_lien_c6.h
    - firmware/ecran/tab5_lien_c6.cpp
    - firmware/ecran/tab5_dalle.h
    - firmware/ecran/tab5_dalle.cpp

# ─── 1. SoC ESP32-P4 v3.2 @ 400 MHz & PSRAM Hex 200 MHz ────────────────────

esp32:
  variant: esp32p4
  engineering_sample: false
  cpu_frequency: 400MHz
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      execute_from_psram: true
      compiler_optimization: PERF
      loop_task_stack_size: 16384
    sdkconfig_options:
      CONFIG_SPI_FLASH_YIELD_DURING_ERASE: "y"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "15"
      CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY: "y"
      CONFIG_CACHE_L2_CACHE_256KB: "y"
      CONFIG_SPIRAM_MEMTEST: "n"
      CONFIG_LWIP_DHCP_DOES_ARP_CHECK: "n"
      CONFIG_LWIP_DHCP_DOES_NOT_CHECK_OFFERED_IP: "y"
      CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: "y"

psram:
  mode: hex
  speed: 200MHz

# ─── 2. Coprocesseur Wi-Fi 6 ESP32-C6-MINI-1 (SDIO Slot 1) ─────────────────

esp32_hosted:
  variant: esp32c6
  active_high: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  reset_pin: GPIO54
  slot: 1
  sdio_frequency: 20MHz
  use_psram: true

globals:
  - id: lien_c6_branche
    type: bool
    initial_value: 'lien_c6_demarrage()'

logger:
  level: INFO
  baud_rate: 115200
  hardware_uart: USB_SERIAL_JTAG
  tx_buffer_size: 2048
  on_message:
    level: INFO
    then:
      - lambda: 'journal_log_message(level, tag, message);'

ota:
  - platform: esphome
    on_begin:
      - globals.set: { id: ota_en_cours, value: 'true' }
      - script.execute: { id: tab5_dalle_ota, debut: true }
    on_abort:
      - globals.set: { id: ota_en_cours, value: 'false' }
      - script.execute: { id: tab5_dalle_ota, debut: false }
    on_error:
      - globals.set: { id: ota_en_cours, value: 'false' }
      - script.execute: { id: tab5_dalle_ota, debut: false }

safe_mode:
  num_attempts: 10
  boot_is_good_after: 30s

# ─── 3. Bus I2C, Écran MIPI-DSI EK79007, Tactile GT911 & Rétroéclairage ────

i2c:
  - id: bsp_bus
    sda: GPIO7
    scl: GPIO8
    frequency: 400kHz

esp_ldo:
  - voltage: 2.5V
    channel: 3

display:
  - id: tab5_display
    platform: mipi_dsi
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    dimensions:
      width: ${carte_dalle_l}
      height: ${carte_dalle_h}
    pixel_mode: 16bit
    color_order: RGB
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - id: touch
    platform: gt911
    reset_pin: GPIO23
    update_interval: 50ms
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true
    on_touch:
      - lambda: 'ui_mark_activity();'
      - script.execute: tab5_economie_appliquer
    on_release:
      then:
        - if:
            condition:
              light.is_off: backlight
            then:
              - light.turn_on: backlight

output:
  - platform: ledc
    id: backlight_pwm
    pin:
      number: GPIO32
      inverted: true
    frequency: 5000Hz
  - platform: template
    id: backlight_plafonne
    type: float
    write_action:
      - lambda: |-
          if (state > 0.0f) demarrage_marquer(EtapeDemarrage::RETRO);
          id(backlight_pwm).set_level(economie_sortie_retro(state));

light:
  - platform: monochromatic
    output: backlight_plafonne
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    initial_state:
      brightness: 75%
    default_transition_length: 250ms
    on_turn_on:
      - script.execute: tab5_dalle_rallumer
      - globals.set: { id: ecran_eteint_par_nuit, value: 'false' }
      - lambda: 'id(ecran_allume_ms) = millis();'
      - script.execute: tab5_economie_appliquer
    on_turn_off:
      - lambda: 'dalle_eteindre(id(tab5_display));'
      - lvgl.pause:

script:
  - id: tab5_dalle_rallumer
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return dalle_reveiller(id(tab5_display));'
          then:
            - delay: 120ms
      - if:
          condition:
            lambda: 'return id(backlight).remote_values.is_on() && !(dalle_noire_pendant_ota() && id(ota_en_cours));'
          then:
            - lambda: 'dalle_rallumer(id(tab5_display));'
            - lvgl.resume:
  - id: tab5_dalle_ota
    parameters:
      debut: bool
    then:
      - if:
          condition:
            lambda: 'return dalle_noire_pendant_ota() && id(backlight).remote_values.is_on();'
          then:
            - if:
                condition:
                  lambda: 'return debut;'
                then:
                  - lambda: 'dalle_eteindre(id(tab5_display));'
                else:
                  - script.execute: tab5_dalle_rallumer

# ─── 4. Audio : Alertes Sonores ES8311 + NS4150B (GPIO53) & Micros ES7210 ──

i2s_audio:
  - id: mic_bus
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12
    i2s_mclk_pin: GPIO13

audio_adc:
  - platform: es7210
    id: es7210_adc
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 30dB

microphone:
  - platform: i2s_audio
    id: tab5_microphone
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external
    correct_dc_offset: true

audio_dac:
  - platform: es8311
    id: es8311_dac

speaker:
  - platform: i2s_audio
    id: tab5_speaker
    i2s_dout_pin: GPIO9
    audio_dac: es8311_dac
    dac_type: external
    channel: mono
    buffer_duration: 500ms
    timeout: 2000ms
    bits_per_sample: 16bit
    sample_rate: 48000

media_player:
  - platform: speaker
    name: "Vigie Alerte Audio"
    id: speaker_player
    # Plafonnement impératif à 75 % (0xBF = 0 dB dans REG32 de l'ES8311) pour éviter
    # la saturation numérique (+32 dB à 100 %).
    volume_max: 75%
    announcement_pipeline:
      speaker: tab5_speaker
      format: FLAC
      sample_rate: 24000
      num_channels: 1

switch:
  # Amplificateur Classe D NS4150B (H7) commandé par GPIO53 (actif haut)
  - platform: gpio
    id: speaker_enable
    name: "Amplificateur Audio"
    pin: GPIO53
    restore_mode: ALWAYS_ON
    internal: true

# ─── 5. Alimentation Batterie 1S (J4 MX1.25 / ETA6098) sur GPIO20 ──────────
# Lecture de la tension batterie via le pont diviseur matériel 200 kΩ / 100 kΩ (VBAT / 3).
# Décommenter ou utiliser directement `batterie_tension_7b` lorsqu'un accumulateur Li-ion 1S
# est raccordé sur le connecteur J4.
sensor:
  - platform: adc
    pin: GPIO20
    id: batterie_tension
    name: "Tension Batterie 7B"
    update_interval: 60s
    attenuation: 12db
    internal: true
    filters:
      - multiply: 3.0

button:
  - platform: restart
    id: btn_restart
    name: "Redémarrage Système"

debug:
