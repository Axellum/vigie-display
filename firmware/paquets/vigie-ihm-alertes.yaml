# ==============================================================================
# PAQUET : VIGIE-IHM-ALERTES (Modales Détail Catastrophe, Urgence & Audio RTTTL)
# ==============================================================================
# Relie les interactions tactiles de l'écran (7B 1024×600 & Tab5 1280×720) au
# contrôleur C++ pur `vigie_ihm_controleur.h/.cpp` :
#   - `vigie_action_acquitter_urgence` : acquitte l'alerte critique active,
#     mémorise son ID dans l'anneau anti-répétition NVS et coupe la sirène.
#   - `vigie_action_zone_suivante` / `vigie_action_zone_precedente` : fait
#     défiler le rouleau des zones mondiales et recalcule les relèvements.
#   - `vigie_action_ouvrir_alerte` : prépare et ouvre la fiche « Détail
#     Catastrophe » (DMS, distance km/NM, Cap ° + Cardinal, ETA Tsunami).
#   - `vigie_action_jouer_alerte_sonore` : déclenche le profil RTTTL calibré
#     avec volume plafonné à <= 75 % (0 dB sans saturation sur l'ES8311).
# ==============================================================================

script:
  - id: vigie_action_acquitter_urgence
    mode: single
    then:
      - lambda: |-
          const bool ok = vigie_ihm_acquitter_urgence_active(g_vigie_etat_mondial, g_vigie_etat_ihm);
          vigie_preparer_bloc_nvs(g_vigie_etat_mondial, g_vigie_bloc_nvs_cache);
          id(vigie_popup_urgence_actif).publish_state(false);
          id(vigie_popup_detail_actif).publish_state(false);
          ESP_LOGI("vigie_ihm", "Urgence acquittée par l'opérateur (ok=%d, total_ack=%u)",
                   ok ? 1 : 0, (unsigned)g_vigie_etat_mondial.nb_acquittees);

  - id: vigie_action_zone_suivante
    mode: single
    then:
      - lambda: |-
          const int8_t idx = vigie_zone_suivante(g_vigie_etat_mondial);
          if (idx >= 0 && idx < (int8_t)g_vigie_etat_mondial.nb_zones) {
            id(vigie_zone_active_nom).publish_state(g_vigie_etat_mondial.zones[idx].nom);
            ESP_LOGI("vigie_ihm", "Zone active suivante -> [%d] %s",
                     (int)idx, g_vigie_etat_mondial.zones[idx].nom);
          }

  - id: vigie_action_zone_precedente
    mode: single
    then:
      - lambda: |-
          const int8_t idx = vigie_zone_precedente(g_vigie_etat_mondial);
          if (idx >= 0 && idx < (int8_t)g_vigie_etat_mondial.nb_zones) {
            id(vigie_zone_active_nom).publish_state(g_vigie_etat_mondial.zones[idx].nom);
            ESP_LOGI("vigie_ihm", "Zone active précédente -> [%d] %s",
                     (int)idx, g_vigie_etat_mondial.zones[idx].nom);
          }

  - id: vigie_action_zone_gps
    mode: single
    then:
      - lambda: |-
          if (vigie_selectionner_zone_gps(g_vigie_etat_mondial)) {
            const int8_t idx = g_vigie_etat_mondial.zone_active_idx;
            id(vigie_zone_active_nom).publish_state(g_vigie_etat_mondial.zones[idx].nom);
            ESP_LOGI("vigie_ihm", "Retour direct sur la Zone GPS Mobile [%d] %s",
                     (int)idx, g_vigie_etat_mondial.zones[idx].nom);
          }

  - id: vigie_action_ouvrir_alerte
    parameters:
      index: int
    then:
      - lambda: |-
          if (vigie_ihm_ouvrir_detail_alerte(g_vigie_etat_mondial, index, g_vigie_etat_ihm)) {
            const VigieFicheDetailAlerte& f = g_vigie_etat_ihm.fiche_courante;
            id(vigie_popup_detail_actif).publish_state(true);
            id(vigie_fiche_titre).publish_state(f.titre);
            id(vigie_fiche_coord_dms).publish_state(f.coord_dms);
            char dist_cap_buf[128] = {};
            std::snprintf(dist_cap_buf, sizeof(dist_cap_buf), "%s · %s", f.distance_km_nm, f.relevement_cap);
            id(vigie_fiche_distance_cap).publish_state(dist_cap_buf);
            id(vigie_fiche_eta_tsunami).publish_state(f.eta_tsunami);
            ESP_LOGI("vigie_ihm", "Ouverture fiche alerte [%d] %s (%s — %s — %s)",
                     index, f.id, f.distance_km_nm, f.relevement_cap, f.eta_tsunami);
          }

  - id: vigie_action_fermer_alerte
    mode: single
    then:
      - lambda: |-
          vigie_ihm_fermer_detail_alerte(g_vigie_etat_ihm);
          id(vigie_popup_detail_actif).publish_state(false);

  - id: vigie_action_jouer_alerte_sonore
    mode: restart
    then:
      - lambda: |-
          const VigieProfilSonoreAlerte& p = g_vigie_etat_ihm.profil_sonore_courant;
          if (!p.actif || p.rtttl == nullptr || p.rtttl[0] == '\0') {
            return;
          }
          const uint8_t vol_securise = (p.volume_pct <= kVigieVolumeMaxSecurisePct)
                                           ? p.volume_pct
                                           : kVigieVolumeMaxSecurisePct;
          id(vigie_audio_profil_actif).publish_state(p.nom_profil);
          ESP_LOGW("vigie_audio", "Séquence sonore d'urgence : %s (vol=%u%% <= 75%% ES8311, rep=%u, rtttl=%s)",
                   p.nom_profil, (unsigned)vol_securise, (unsigned)p.nb_repetitions, p.rtttl);

binary_sensor:
  - platform: template
    id: vigie_popup_urgence_actif
    name: "Vigie Popup Urgence Critique Actif"
    internal: true

  - platform: template
    id: vigie_popup_detail_actif
    name: "Vigie Popup Détail Catastrophe Actif"
    internal: true

text_sensor:
  - platform: template
    id: vigie_zone_active_nom
    name: "Vigie Zone Météo Active"
    internal: true

  - platform: template
    id: vigie_fiche_titre
    name: "Vigie Fiche Alerte Titre"
    internal: true

  - platform: template
    id: vigie_fiche_coord_dms
    name: "Vigie Fiche Alerte Coordonnées DMS"
    internal: true

  - platform: template
    id: vigie_fiche_distance_cap
    name: "Vigie Fiche Alerte Distance & Cap"
    internal: true

  - platform: template
    id: vigie_fiche_eta_tsunami
    name: "Vigie Fiche Alerte ETA Tsunami"
    internal: true

  - platform: template
    id: vigie_audio_profil_actif
    name: "Vigie Profil Audio Alerte"
    internal: true
