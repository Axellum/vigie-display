# ============================================================================
# [AI-CONTEXT]
# @file geometrie-waveshare-7b.yaml
# @role Dimensions et orientation natives de la Waveshare ESP32-P4-WIFI6-Touch-LCD-7B
#       (ADR-0003) : 1024×600 en paysage natif, `carte_rotation: "0"` par défaut
#       (zéro rotation logicielle LVGL = ~69 ms/frame au lieu de ~83 ms, mesuré le
#       16/10/2026). Si le boîtier est posé dans l'autre sens, passer `carte_rotation`
#       à `"180"`.
# @architecture_constraint Mêmes clés de substitution que `geometrie-tab5.yaml`
#       pour permettre la déclinaison Multi-Écrans transparente (`vigie_carte: waveshare-7b`
#       ou `vigie_carte: tab5`).
# ============================================================================
substitutions:
  carte_ecran_l: "1024"
  carte_ecran_h: "600"
  carte_dalle_l: "1024"
  carte_dalle_h: "600"
  carte_rotation: "0"
  carte_police_echelle: "0.82"
