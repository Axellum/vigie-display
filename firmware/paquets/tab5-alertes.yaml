# ============================================================================
# [AI-CONTEXT]
# @file tab5-alertes.yaml
# @role Gestion du popup « Alertes » en mode autonome (Zéro Home Assistant) :
#       pose les widgets que `tab5_alertes.cpp` peint (`g_alertes_ui`) et déclenche
#       le rafraîchissement local depuis le modèle mondial (`vigie_modele_mondial.h`).
# ============================================================================

script:
  - id: tab5_alertes_ouvrir
    then:
      - lambda: |-
          AlertesUI& u = g_alertes_ui;
          if (u.popup == nullptr) {
            u.liste = id(alertes_liste);
            u.attente = id(alertes_attente);
            u.tout_lu = id(btn_alertes_tout_lu);
            u.police = id(roboto_32_b);
            u.police_heures = id(roboto_22);
            u.demander = []() { id(tab5_alertes_demande).execute(); };
            u.popup = id(alertes_popup);
          }
          alertes_ouvrir();

  - id: tab5_alertes_demande
    mode: queued
    max_runs: 2
    then:
      - lambda: |-
          // Mode autonome : les alertes mondiales sont lues depuis le cache local / client API direct
          ESP_LOGD("vigie.alertes", "Rafraichissement local de l'historique des alertes mondiales");

  - id: tab5_alertes_tout_lu
    mode: single
    then:
      - lambda: |-
          alertes_tout_lu_local();
