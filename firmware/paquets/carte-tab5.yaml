# ============================================================================
# [AI-CONTEXT]
# @file carte-tab5.yaml
# @role Carte M5Stack Tab5 V2 (5" 1280×720, ESP32-P4 @ 360 MHz, 32 Mo PSRAM hex
#       200 MHz, 16 Mo Flash, expandeurs PI4IOE5V6408 0x43/0x44, batterie 2S INA226
#       0x41, RTC RX8130CE 0x32, IMU BMI270 0x68, audio ES8388 + ES7210).
#       Choisie par `vigie_carte: tab5` (ou `tab5_carte: tab5`).
# @architecture_constraint Regroupe `geometrie-tab5.yaml`, `tab5-hardware.yaml`,
#       `tab5-imu.yaml` et la révision d'écran `ecran-${tab5_ecran}.yaml`
#       (`st7123` par défaut, `st7121`, `ili9881c`, `st7703`).
# ============================================================================
substitutions:
  carte_c6_version: "true"
  # Attente bloquante de 1000 ms au démarrage pour stabiliser l'expandeur I2C PI4IOE5V6408
  # avant le reset de la dalle MIPI-DSI (ADR-0005).
  carte_attente_ecran_ms: "1000"
  # Port A Grove HY2.0-4P / M5-Bus du M5Stack Tab5 pour le module M5Stack Unit GPS SMA (AT6668)
  vigie_gps_rx_pin: "GPIO53"
  vigie_gps_tx_pin: "GPIO54"
  vigie_gps_baud_rate: "115200"

packages:
  geometrie: !include geometrie-tab5.yaml
  tab5_hardware: !include tab5-hardware.yaml
  tab5_ecran: !include ecran-${ tab5_ecran | default('st7123') | lower }.yaml
  imu: !include tab5-imu.yaml
