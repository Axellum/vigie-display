# ==============================================================================
# PAQUET : VIGIE-GPS-NMEA (Télémétrie GPS / GNSS NMEA 0183 Temps Réel)
# ==============================================================================
# Compatible Multi-Cartes :
#   1. Waveshare ESP32-P4-WIFI6-Touch-LCD-7B :
#      - Connecteur P3 (4-pin UART Header) : RX=GPIO4, TX=GPIO5
#      - Bornier RS485 embarqué (marine)   : RX=GPIO26, TX=GPIO27
#   2. M5Stack Tab5 V2 (ESP32-P4) :
#      - Port A Grove (HY2.0-4P rouge)     : RX=GPIO53, TX=GPIO54 (Unit GPS SMA AT6668)
#
# Décodage 100 % autonome C++ (firmware/socle/vigie_modele_mondial.cpp) :
#   - Vérification stricte du checksum XOR NMEA (*HH)
#   - Décodage $GPGGA / $GNGGA / $BDGGA (Fix, Satellites, HDOP, Altitude MSL)
#   - Décodage $GPRMC / $GNRMC (Statut A/V, Lat/Lon, SOG nœuds/km/h, COG°, Heure UTC)
#   - Recalcul automatique des distances Haversine, azimuts et ETA tsunami
#     vers les épicentres et bouées marines dès que le navire/véhicule se déplace.
# ==============================================================================

substitutions:
  vigie_gps_uart_id: uart_vigie_gps
  vigie_gps_rx_pin: GPIO4
  vigie_gps_tx_pin: GPIO5
  vigie_gps_baud_rate: "9600"

uart:
  - id: ${vigie_gps_uart_id}
    rx_pin: ${vigie_gps_rx_pin}
    tx_pin: ${vigie_gps_tx_pin}
    baud_rate: ${vigie_gps_baud_rate}
    rx_buffer_size: 512
    debug:
      direction: RX
      dummy_receiver: true
      after:
        delimiter: "\n"
      sequence:
        - lambda: |-
            // Lecture ligne par ligne depuis le buffer UART NMEA 0183
            std::string sentence(bytes.begin(), bytes.end());
            if (vigie_parse_nmea_sentence(sentence.c_str(), g_vigie_etat_mondial.gps)) {
              if (g_vigie_etat_mondial.gps.valide) {
                vigie_recalculer_distances_gps(g_vigie_etat_mondial);
              }
            }

interval:
  - interval: 2s
    then:
      - lambda: |-
          id(vigie_gps_fix_ok).publish_state(g_vigie_etat_mondial.gps.valide);
          id(vigie_gps_satellites).publish_state(g_vigie_etat_mondial.gps.satellites);
          id(vigie_gps_hdop).publish_state(g_vigie_etat_mondial.gps.hdop);
          char coord_buf[32] = {};
          if (g_vigie_etat_mondial.gps.valide) {
            id(vigie_gps_latitude).publish_state(static_cast<float>(g_vigie_etat_mondial.gps.lat_deg));
            id(vigie_gps_longitude).publish_state(static_cast<float>(g_vigie_etat_mondial.gps.lon_deg));
            id(vigie_gps_altitude).publish_state(g_vigie_etat_mondial.gps.altitude_m);
            id(vigie_gps_vitesse_noeuds).publish_state(g_vigie_etat_mondial.gps.vitesse_noeuds);
            id(vigie_gps_vitesse_kmh).publish_state(vigie_noeuds_vers_kmh(g_vigie_etat_mondial.gps.vitesse_noeuds));
            id(vigie_gps_cap_deg).publish_state(g_vigie_etat_mondial.gps.cap_deg);
            g_vigie_etat_mondial.gps.formater_coord_nautique(coord_buf, sizeof(coord_buf));
            id(vigie_gps_coords_nautiques).publish_state(coord_buf);
          } else {
            g_vigie_etat_mondial.gps.formater_coord_nautique(coord_buf, sizeof(coord_buf));
            id(vigie_gps_coords_nautiques).publish_state(coord_buf);
          }

binary_sensor:
  - platform: template
    id: vigie_gps_fix_ok
    name: "Vigie GPS Fix Valide"
    internal: true

sensor:
  - platform: template
    id: vigie_gps_latitude
    name: "Vigie GPS Latitude"
    unit_of_measurement: "°"
    accuracy_decimals: 5
    internal: true

  - platform: template
    id: vigie_gps_longitude
    name: "Vigie GPS Longitude"
    unit_of_measurement: "°"
    accuracy_decimals: 5
    internal: true

  - platform: template
    id: vigie_gps_altitude
    name: "Vigie GPS Altitude MSL"
    unit_of_measurement: "m"
    accuracy_decimals: 1
    internal: true

  - platform: template
    id: vigie_gps_satellites
    name: "Vigie GPS Satellites"
    unit_of_measurement: "sat"
    accuracy_decimals: 0
    internal: true

  - platform: template
    id: vigie_gps_hdop
    name: "Vigie GPS HDOP"
    accuracy_decimals: 1
    internal: true

  - platform: template
    id: vigie_gps_vitesse_noeuds
    name: "Vigie GPS SOG (Noeuds)"
    unit_of_measurement: "kn"
    accuracy_decimals: 1
    internal: true

  - platform: template
    id: vigie_gps_vitesse_kmh
    name: "Vigie GPS Vitesse (km/h)"
    unit_of_measurement: "km/h"
    accuracy_decimals: 1
    internal: true

  - platform: template
    id: vigie_gps_cap_deg
    name: "Vigie GPS COG (Cap)"
    unit_of_measurement: "°"
    accuracy_decimals: 1
    internal: true

text_sensor:
  - platform: template
    id: vigie_gps_coords_nautiques
    name: "Vigie GPS Coordonnées Nautiques"
    internal: true
