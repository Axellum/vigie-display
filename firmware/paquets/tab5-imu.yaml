# ============================================================================
# [AI-CONTEXT]
# @file tab5-imu.yaml
# @role BMI270 (IMU embarquée sur M5Stack Tab5 V2, adresse I2C 0x68 sur bsp_bus) :
#       accéléromètre/gyroscope local pour le réveil d'écran par tape franche
#       (tap-to-wake, > 2,5 g, anti-rebond 500 ms).
# @architecture_constraint 100 % local (`internal: true`), zéro publication Home Assistant.
# ============================================================================

motion:
  - platform: bmi270
    id: tab5_imu
    address: 0x68
    i2c_id: bsp_bus
    accelerometer_range: 4G
    accelerometer_odr: 100HZ
    gyroscope_range: 2000DPS
    gyroscope_odr: 200HZ
    update_interval: 100ms

sensor:
  - platform: motion
    type: acceleration_x
    id: imu_accel_x
    internal: true

  - platform: motion
    type: acceleration_y
    id: imu_accel_y
    internal: true

  - platform: motion
    type: acceleration_z
    id: imu_accel_z
    internal: true
    on_value:
      then:
        - lambda: |-
            float ax = id(imu_accel_x).state;
            float ay = id(imu_accel_y).state;
            float az = x;
            if (isnan(ax) || isnan(ay) || isnan(az)) return;
            if (!id(tab5_tap_to_wake).state) return;
            if (imu_tape_franche(ax, ay, az, millis())) {
                auto call = id(backlight).turn_on();
                call.perform();
            }

switch:
  - platform: template
    name: "Tap-to-Wake"
    id: tab5_tap_to_wake
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    internal: true

interval:
  - interval: 1s
    then:
      - lambda: |-
          const int32_t cadence = imu_cadence_a_changer(
              !id(backlight).current_values.is_on() && id(tab5_tap_to_wake).state);
          if (cadence < 0) return;
          id(tab5_imu).stop_poller();
          if (cadence == 0) return;
          id(tab5_imu).set_update_interval(cadence);
          id(tab5_imu).start_poller();
